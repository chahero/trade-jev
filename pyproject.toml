[project]
name = "trade-jev"
version = "0.1.0"
description = "Watch Jev make Bitcoin paper trading decisions."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "typesafe-sdk==0.7.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
